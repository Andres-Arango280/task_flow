# =====================================================
# SonarQube Configuration for TaskFlow Frontend
# =====================================================

# Información del Proyecto
sonar.projectKey=taskflow:frontend
sonar.projectName=TaskFlow Frontend
sonar.projectVersion=1.0.0

# Descripción
sonar.projectDescription=Aplicación React para gestión de tareas colaborativas

# Fuente
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.e2e.spec.ts

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Cobertura de código
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/types/**,**/pages/**,**/components/**/*.styles.ts

# Lenguajes
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript

# Análisis de seguridad
sonar.security.hotspots.reviewed.percentage=100

# Host SonarQube
sonar.host.url=http://localhost:9000

# Token (reemplazar con token real)
# sonar.login=YOUR_SONAR_TOKEN_HERE

# Ramas
# sonar.branch.name=main  (solo Developer Edition; la Community analiza la rama por defecto)

# =====================================================
# Métricas de React
# =====================================================

# Análisis de componentes
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Detectar código muerto

# =====================================================
# Umbrales de Calidad
# =====================================================

# Perfil de calidad
