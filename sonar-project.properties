# =====================================================
# SonarQube Configuration for TaskFlow Project
# =====================================================

# Información del Proyecto
sonar.projectKey=taskflow:backend
sonar.projectName=TaskFlow Backend
sonar.projectVersion=1.0.0

# Descripción
sonar.projectDescription=API REST para gestión de tareas colaborativas con NestJS

# Fuente
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e.spec.ts
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.module.ts,**/*.controller.ts,**/*.dto.ts,**/*.spec.ts,**/*.e2e.spec.ts,**/main.ts,**/taskflow-frontend/**,**/config/**

# Cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.module.ts,**/*.controller.ts,**/*.dto.ts,**/main.ts,**/*.interface.ts,**/taskflow-frontend/**,**/config/**

# Lenguajes
sonar.language=ts
sonar.sourceEncoding=UTF-8
sonar.lang.patterns=**/*.ts,**/*.tsx

# TypeScript/JavaScript
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Análisis de seguridad
sonar.security.hotspots.reviewed.percentage=100
sonar.security.hotspots.max=10

# Reglas
sonar.qualitygate.wait=true

# Host SonarQube
sonar.host.url=http://localhost:9000
# Credenciales: usar la variable de entorno SONAR_TOKEN (no se versionan aquí)

# Ramas
# La edición Community no admite análisis de ramas por propiedad; se usa la rama por defecto del proyecto.

# Pull requests
# sonar.pullrequest.key=1
# sonar.pullrequest.branch=feature/auth
# sonar.pullrequest.base=main

# =====================================================
# Métricas clave a monitorear
# =====================================================

# Umbral de cobertura de código
sonar.javascript.coveragePlugin=lcov

# Umbral de duplicación
sonar.cpd.min_tokens=100

# Umbral de deuda técnica
sonar.technicalDebt.ratingGrid=0.05,0.1,0.2,0.5

# =====================================================
# Profiles y Calidad
# =====================================================

# Perfil de calidad
sonar.profile=Sonar%20way

# Puerta de calidad (Quality Gate)
sonar.qualitygate.name=Sonar%20way
